---
- name: Установка сервиса мониторинга логов
  hosts: all
  become: yes
  tags:
    - log_monitor

  tasks:
    - name: Копирование скрипта мониторинга
      copy:
        src: files/log_monitor.sh
        dest: /usr/local/bin/log-monitor.sh
        mode: '0755'

    - name: Создание конфигурационного файла
      copy:
        content: |
          LOG_FILE="/var/log/syslog"
          KEYWORD="ERROR"
        dest: /etc/default/log-monitor
        mode: '0644'

    - name: Создание systemd service файла
      copy:
        content: |
          [Unit]
          Description=Log Monitor Script

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/log-monitor.sh
          StandardOutput=journal
          StandardError=journal
        dest: /etc/systemd/system/log-monitor.service
        mode: '0644'

    - name: Создание systemd timer файла
      copy:
        content: |
          [Unit]
          Description=Log Monitor Timer
          Requires=log-monitor.service

          [Timer]
          OnCalendar=*:*:0/30
          Persistent=true

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/log-monitor.timer
        mode: '0644'

    - name: Перезагрузка systemd
      systemd:
        daemon_reload: yes

    - name: Запуск таймера
      systemd:
        name: log-monitor.timer
        enabled: yes
        state: started




   

